[project]
name = "clinical-nlp-claims-processing"
version = "0.1.0"
description = "VA Disability Claims NLP Demonstration Project - BioBERT entity extraction, AWS Comprehend Medical comparison, and automated claims processing pipeline"
readme = "README.md"
authors = [
    { name = "alexr", email = "alexretana@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Jupyter and AI
    "jupyter-ai==3.0.0b7",
    "jupyterlab>=4.0.0",

    # NLP and Transformers
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "tokenizers>=0.15.0",

    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "kagglehub>=0.2.0",

    # Machine Learning
    "scikit-learn>=1.3.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "spacy>=3.7.0",
    "wordcloud>=1.9.0",

    # AWS Integration
    "boto3>=1.29.0",

    # Synthetic Data and Document Generation
    "faker>=20.0.0",
    "reportlab>=4.0.0",

    # Optional OCR (commented out by default)
    # "pytesseract>=0.3.10",
    # "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
